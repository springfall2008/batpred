name: owner gate
# A required status standing in for "only the repository owner merges": main's ruleset requires a
# status named owner-approval. GitHub's auto-merge never uses an admin bypass, so restricting updates to
# the owner would also block the owner's own auto-merge; this gate keeps both.
#
# The job never fails just because the owner has not approved yet. It records its verdict as an
# owner-approval commit status instead: pending ("waiting for the owner") until the go-ahead, then
# success. GitHub emails whoever triggered a FAILED workflow run, so a failing job sent every
# contributor a "run failed" email on every PR - the pending status blocks the merge just as well
# without one. The job is named differently from the status so its own green tick cannot satisfy the
# requirement. The newest owner-approval status on the head commit is the one that counts.
#
# A commit status rather than a check run: a check run created with the workflow token is filed into
# the oldest GitHub Actions check suite on the commit, and the merge box only shows each workflow's
# latest run for an event. Once a second run of this workflow fired for the same event on a commit, the
# check sat in a superseded suite, so the merge box showed it as "Expected" however often it passed
# (PRs #6001 and #6007). A commit status belongs to no suite.
#
# It passes only when the owner has given this PR an explicit go-ahead, whoever authored it:
# - the owner applied the owner-approved label (the most recent time that label was applied, the
#   owner applied it - a collaborator labelling a PR does not count), or
# - the owner enabled auto-merge on it, or
# - the owner's latest review approves the PR's current head commit (an approval of an earlier commit
#   is stale and does not count).
# Authorship deliberately counts for nothing: the triage bot opens PRs under the owner's account, and
# an unreviewed bot PR must not become mergeable by any collaborator the moment CI goes green.
#
# New commits pushed by anyone other than the owner revoke the go-ahead - the label is removed and
# auto-merge is switched off - so an approval only ever covers code the owner saw (the same idea as
# dismissing a stale review). The CI bots that push fixes to PR branches are exempt.
#
# Events often arrive seconds apart (a push, a review, a label change), each starting its own run, and
# the runs can finish in any order, so a run that read the PR before a later event could record its
# stale verdict last. Each run therefore re-reads the PR after recording and corrects the status until
# its verdict holds. There is deliberately no concurrency group: GitHub keeps only the newest pending
# run in a group, and dropping a pending run of a non-owner's push would drop its revocation.
#
# pull_request_target so the job runs this file as it is on main and gets a token that can remove the
# label and switch auto-merge off. GitHub has no _target variant of pull_request_review, so a review
# runs the copy of this file in the PR's merge ref instead - main's copy unless the PR edits it. On a
# PR from a fork that run gets a read-only token and cannot record the status, so for fork PRs the owner
# uses the label or auto-merge instead of a review. Neither path checks out or runs the PR's code.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - auto_merge_enabled
      - auto_merge_disabled
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  statuses: write
  issues: write
  pull-requests: write

jobs:
  evaluate:
    # Not "owner-approval": this job's own check must not be the one the ruleset requires
    name: owner gate evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the owner approved this PR or enabled auto-merge on it
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"

          # Read the PR and decide: sets head_sha, pr_id, auto_merge_by, has_label, verdict ("pass" or
          # "wait") and message
          evaluate() {
            state=$(gh api graphql -F owner="$owner" -F repo="${GH_REPO#*/}" -F number="$PR_NUMBER" -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    headRefOid
                    autoMergeRequest { enabledBy { login } }
                    labels(first: 100) { nodes { name } }
                    latestOpinionatedReviews(first: 100) { nodes { author { login } state commit { oid } } }
                  }
                }
              }' --jq '.data.repository.pullRequest')
            pr_id=$(jq -r '.id' <<< "$state")
            auto_merge_by=$(jq -r '.autoMergeRequest.enabledBy.login // ""' <<< "$state")
            has_label=$(jq -r --arg label "$LABEL" '[.labels.nodes[].name] | index($label) != null' <<< "$state")
            owner_approved_head=$(jq -r --arg owner "$owner" '.headRefOid as $head | [.latestOpinionatedReviews.nodes[] | select(.author.login == $owner and .state == "APPROVED" and .commit.oid == $head)] | length > 0' <<< "$state")
            head_sha=$(jq -r '.headRefOid' <<< "$state")

            verdict=pass
            if [ "$auto_merge_by" = "$owner" ]; then
              message="$owner enabled auto-merge"
              return
            fi
            if [ "$has_label" = "true" ]; then
              applied_by=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/events" \
                --jq ".[] | select(.event == \"labeled\" and .label.name == \"$LABEL\") | .actor.login" | tail -n 1)
              if [ "$applied_by" = "$owner" ]; then
                message="$owner approved this PR with $LABEL"
                return
              fi
              echo "$LABEL was applied by ${applied_by:-nobody}, not $owner, so it does not count"
            fi
            if [ "$owner_approved_head" = "true" ]; then
              message="$owner approved the current head commit in a review"
              return
            fi
            verdict=wait
            message="Waiting for $owner to apply the $LABEL label, enable auto-merge or approve the PR"
          }

          # Record the verdict as the owner-approval commit status on the head commit: "pass" as success,
          # "wait" as pending, which blocks the merge without failing this job. The newest status for a
          # context is the one that counts, so each verdict simply posts a new one. The description is
          # capped at GitHub's 140 characters; the full message is in this run's log, which the status links to
          record() {
            echo "$2"
            if [ "$1" = "pass" ]; then status_state=success; else status_state=pending; fi
            post_status "$2" || { sleep 2; post_status "$2"; } \
              || echo "::warning::Could not record the owner-approval status - a review on a fork PR has a read-only token, so apply $LABEL or enable auto-merge instead"
          }

          # Post the owner-approval status with description $1
          post_status() {
            gh api "repos/$GH_REPO/statuses/$head_sha" -f state="$status_state" -f context=owner-approval \
              -f description="${1:0:140}" -f target_url="$RUN_URL" > /dev/null
          }

          evaluate

          # New commits from anyone but the owner (or the CI bots) revoke an earlier go-ahead. A failed
          # revocation must not end the run before the waiting status is recorded: that would leave the new
          # commit with no owner-approval status and send its pusher a "run failed" email
          if [ "$ACTION" = "synchronize" ] && [ "$SENDER" != "$owner" ] && [ "$SENDER" != "pre-commit-ci[bot]" ] && [ "$SENDER" != "github-actions[bot]" ]; then
            not_revoked=""
            if [ "$has_label" = "true" ]; then
              gh api -X DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/$LABEL" > /dev/null || not_revoked="the $LABEL label"
            fi
            if [ -n "$auto_merge_by" ]; then
              gh api graphql -F id="$pr_id" -f query='mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId } }' > /dev/null \
                || not_revoked="${not_revoked:+$not_revoked and }auto-merge"
            fi
            if [ -n "$not_revoked" ]; then
              echo "::warning::Could not remove $not_revoked after $SENDER pushed - remove it by hand, or the next event's run will pass the new commits"
              record wait "$SENDER pushed new commits but $not_revoked could not be removed - $owner must remove it by hand before any further event, or the new commits will pass"
              exit 0
            fi
            record wait "$SENDER pushed new commits, so any approval was revoked - waiting for $owner to apply $LABEL, enable auto-merge or approve the new commits"
            exit 0
          fi

          # Record, then re-read the PR to catch an event that landed while this run was working (its own
          # run may have recorded first). The pause lets the API catch up with another run's label or
          # auto-merge change. A new head commit has its own run, so this one stops there
          for attempt in 1 2 3; do
            record "$verdict" "$message"
            recorded_verdict="$verdict"
            recorded_head="$head_sha"
            sleep 5
            evaluate
            if [ "$head_sha" != "$recorded_head" ] || [ "$verdict" = "$recorded_verdict" ]; then
              exit 0
            fi
            echo "The PR changed while this run was recording its verdict (attempt $attempt) - recording again"
          done
          echo "::warning::The PR kept changing while this run recorded its verdict - the owner-approval status follows the next event's run"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SENDER: ${{ github.event.sender.login }}
          ACTION: ${{ github.event.action }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: owner-approved
