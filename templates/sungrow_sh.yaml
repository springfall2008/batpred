# Predbat config for Sungrow SH hybrid inverters (SH5.0RT, SH10RT, SH6.0RS, ...),
# via mkaiser's Sungrow SHx Modbus package
# (https://github.com/mkaiser/Sungrow-SHx-Inverter-Modbus-Home-Assistant)
#
# Predbat has no built-in Sungrow inverter type, so this is a custom inverter
# type controlled through Predbat's Service API: a charge or export puts the
# inverter's EMS mode into "Forced mode" with a forced charge or discharge
# command, and stopping returns it to "Self-consumption mode (default)".
# See the Sungrow SH section of the inverter setup docs.
#
# Copy this over your apps.yaml and:
#   1. Install mkaiser's Modbus package and check its sensors and its EMS mode,
#      Battery forced charge discharge and Battery max charge/discharge power
#      controls work.
#   2. Set soc_max to your usable battery size in kWh, and check inverter_limit
#      and battery_rate_max against your inverter.
#   3. Delete the template: True line below once you have configured this file.
---
pred_bat:
  module: predbat
  class: PredBat
  prefix: predbat
  timezone: Europe/London
  currency_symbols:
    - '£'
    - 'p'
  threads: auto
  # XXX: This is a configuration template, delete this line once you edit your configuration
  template: True
  load_filter_threshold: 30

  # ─── Sungrow energy sensors ───────────────────────────────────────────────
  # The package's Daily consumed energy is the whole house load (PV - export +
  # import - battery charge + battery discharge). Very old versions of the
  # package counted solar/battery only; if yours leaves out grid import, update it.
  load_today:
    - sensor.daily_consumed_energy
  import_today:
    - sensor.daily_imported_energy
  export_today:
    - sensor.daily_exported_energy
  pv_today:
    - sensor.daily_pv_generation

  # ─── Sungrow inverter definition ──────────────────────────────────────────
  # Every setting Predbat reads from an inverter definition is spelled out,
  # because anything left out is copied from the GivEnergy one.
  num_inverters: 1
  # Don't set inverter_mode: Sungrow has no GivEnergy-style mode select, so
  # Predbat keeps its own placeholder for it
  inverter_type: "SGSH"
  inverter:
    name: "Sungrow SH"
    has_rest_api: false
    has_mqtt_api: false
    has_service_api: true
    output_charge_control: "power"
    charge_control_immediate: false
    current_dp: 1
    charge_discharge_with_rate: false
    has_charge_enable_time: false
    has_discharge_enable_time: false
    # No target SoC or reserve in forced mode: Predbat watches the SoC and
    # stops the charge or export itself
    has_target_soc: false
    target_soc_used_for_discharge: false
    has_reserve_soc: false
    has_timed_pause: false
    time_button_press: false
    support_charge_freeze: false
    support_discharge_freeze: false
    support_feedin_first: false
    has_ge_inverter_mode: false
    has_ge_eco_toggle: false
    has_idle_time: false
    has_time_window: false
    charge_time_format: "S"
    charge_time_entity_is_option: false
    can_span_midnight: true
    clock_time_format: "%Y-%m-%d %H:%M:%S"
    num_load_entities: 1
    soc_units: "%"
    write_and_poll_sleep: 2

  # ─── Sungrow control surface (write) ──────────────────────────────────────
  # The order matters: set the forced power and the EMS mode before the forced
  # charge/discharge command, and clear the command before leaving forced mode
  charge_start_service:
    - service: number.set_value
      entity_id: number.battery_forced_charge_discharge_power
      value: "{power}"
    - service: select.select_option
      entity_id: select.ems_mode
      option: "Forced mode"
    - service: select.select_option
      entity_id: select.battery_forced_charge_discharge
      option: "Forced charge"
  charge_stop_service:
    - service: select.select_option
      entity_id: select.battery_forced_charge_discharge
      option: "Stop (default)"
    - service: select.select_option
      entity_id: select.ems_mode
      option: "Self-consumption mode (default)"
  discharge_start_service:
    - service: number.set_value
      entity_id: number.battery_forced_charge_discharge_power
      value: "{power}"
    - service: select.select_option
      entity_id: select.ems_mode
      option: "Forced mode"
    - service: select.select_option
      entity_id: select.battery_forced_charge_discharge
      option: "Forced discharge"
  discharge_stop_service:
    - service: select.select_option
      entity_id: select.battery_forced_charge_discharge
      option: "Stop (default)"
    - service: select.select_option
      entity_id: select.ems_mode
      option: "Self-consumption mode (default)"

  # Predbat's charge and discharge power limits (W). These are the battery's
  # max charge/discharge power, which also cap Self-consumption mode
  charge_rate:
    - number.battery_max_charge_power
  discharge_rate:
    - number.battery_max_discharge_power

  # ─── Sungrow sensor entities (read) ───────────────────────────────────────
  # Battery level is 0-100% of the usable range between the inverter's
  # min and max SoC settings
  soc_percent:
    - sensor.battery_level
  # Usable battery size in kWh: capacity x (max SoC - min SoC) / 100,
  # e.g. 16 kWh with min 5% and max 100% is 15.2
  soc_max:
    - 15.2
  # Positive while discharging, as Predbat expects
  battery_power:
    - sensor.battery_power
  battery_power_invert:
    - false
  pv_power:
    - sensor.total_dc_power
  load_power:
    - sensor.load_power
  # The Sungrow meter reads positive while importing, Predbat wants export
  # positive, hence the invert
  grid_power:
    - sensor.meter_active_power
  grid_power_invert:
    - true

  # ─── Sungrow battery and inverter limits ──────────────────────────────────
  # Maximum battery charge/discharge power in W (sungrow_modbus_battery_max_power
  # in your secrets.yaml)
  battery_rate_max:
    - 10000
  # Inverter AC limit in W, e.g. 10000 for an SH10RT
  inverter_limit:
    - 10000
  inverter_clock_skew_start: 0
  inverter_clock_skew_end: 0
  inverter_clock_skew_discharge_start: 0
  inverter_clock_skew_discharge_end: 0
  clock_skew: 0

  # ─── Solcast solar forecast ───────────────────────────────────────────────
  # Solcast cloud interface, set this or the local interface below
  #solcast_host: 'https://api.solcast.com.au/'
  #solcast_api_key: 'xxxx'
  #solcast_poll_hours: 8
  pv_forecast_today: re:(sensor.(solcast_|)(pv_forecast_|)forecast_today)
  pv_forecast_tomorrow: re:(sensor.(solcast_|)(pv_forecast_|)forecast_tomorrow)
  pv_forecast_d3: re:(sensor.(solcast_|)(pv_forecast_|)forecast_(day_3|d3))
  pv_forecast_d4: re:(sensor.(solcast_|)(pv_forecast_|)forecast_(day_4|d4))
  # ─── Car charging ─────────────────────────────────────────────────────────
  car_charging_energy: 're:(sensor.myenergi_zappi_[0-9a-z]+_charge_added_session|sensor.wallbox_portal_added_energy)'

  # car_charging_power is the live charging power of your car charger, in Watts
  # It is display only - it drives the car shown on the web interface power flow diagram
  # and the predbat.car_charging_power sensor. The plan itself is unaffected by it.
  # Automatically set to detect Wallbox and Zappi, if it doesn't match manually enter your sensor name
  car_charging_power: 're:(sensor.myenergi_zappi_[0-9a-z]+_internal_load_ct1|sensor.wallbox_portal_charging_power)'
  num_cars: 1
  car_charging_planned:
    - 're:(sensor.wallbox_portal_status_description|sensor.myenergi_zappi_[0-9a-z]+_plug_status)'
  car_charging_planned_response:
    - 'yes'
    - 'on'
    - 'true'
    - 'connected'
    - 'ev connected'
    - 'ev ready to charge'
    - 'charging'
    - 'paused'
    - 'waiting for car demand'
    - 'waiting for ev'
    - 'scheduled'
    - 'enabled'
    - 'latched'
    - 'locked'
    - 'plugged in'
    - 'waiting'
  # car_charging_now can be set to a sensor that shows the car is charging right now, so that
  # Predbat holds the house battery for the car while it charges. It never adds a charging slot.
  # Use an on/off sensor (matched against car_charging_now_response), or a charging power sensor
  # in W or kW where 200W or more counts as charging - e.g. for a Wallbox charger:
  #car_charging_now:
  #  - sensor.wallbox_portal_charging_power
  car_charging_now_response:
    - 'yes'
    - 'on'
    - 'true'
    - 'charging'
  #car_charging_battery_size:
  #  - 75
  #car_charging_limit:
  #  - 're:number.tsunami_charge_limit'
  #car_charging_soc:
  #  - 're:sensor.tsunami_battery'
  #car_charging_exclusive:
  #  - True
  # ─── Octopus Energy ───────────────────────────────────────────────────────
  octopus_intelligent_slot: 're:(binary_sensor.octopus_energy([0-9a-z_]+|)_intelligent_dispatching)'
  octopus_ready_time: 're:((select|time).octopus_energy_([0-9a-z_]+|)_intelligent_target_time)'
  octopus_charge_limit: 're:(number.octopus_energy([0-9a-z_]+|)_intelligent_charge_target)'
  #octopus_intelligent_slot: 'binary_sensor.ohme_slot_active'
  #octopus_ready_time: 'time.ohme_target_time'
  #octopus_charge_limit: 'number.ohme_target_percent'
  #octopus_slot_low_rate: False
  octopus_saving_session: 're:(event.octopus_energy([0-9a-z_]+|)_saving_session_event(s|))'
  octopus_saving_session_octopoints_per_penny: 8
  octopus_free_session: 're:(event.octopus_energy_([0-9a-z_]+|)_octoplus_free_electricity_session_events)'
  # octopus_free_url: 'http://octopus.energy/free-electricity'
  # axle_api_key: "xxxxxxx"
  # ─── Energy rates ─────────────────────────────────────────────────────────
  metric_octopus_import: 're:(event.octopus_energy_electricity_[0-9a-z_]+(?<!export)_current_day_rates)'
  #metric_octopus_export: 're:(event.octopus_energy_electricity_[0-9a-z_]+_export_current_day_rates)'
  metric_standing_charge: 're:(sensor.(octopus_energy_|)electricity_[0-9a-z]+_[0-9a-z]+_current_standing_charge)'
  #metric_energidataservice_import: 'sensor.energi_data_service_import'
  #metric_energidataservice_export: 'sensor.energi_data_service_export'
  #rates_import:
  #  -  start: "00:30:00"
  #     end: "04:30:00"
  #     rate: 7.5
  #  -  start: "04:30:00"
  #     end: "00:30:00"
  #     rate: 40.0
  #rates_export:
  #  -  rate: 4.2
  # rates_import_octopus_url : "https://api.oegb-kraken.energy/v1/products/AGILE-24-10-01/electricity-tariffs/E-1R-AGILE-24-10-01-{octopus_region}/standard-unit-rates"
  # rates_export_octopus_url: "https://api.oegb-kraken.energy/v1/products/AGILE-OUTGOING-19-05-13/electricity-tariffs/E-1R-AGILE-OUTGOING-19-05-13-A/standard-unit-rates/"
  #rates_import_override:
  # -  date: '2023-09-10'
  #    start: '14:00:00'
  #    end: '14:30:00'
  #    rate: 112
  #    load_scaling: 0.8
  # ─── Forecast and history ─────────────────────────────────────────────────
  days_previous:
    - 7
  forecast_hours: 48
  load_ml_enable: true
  # load_ml_source: true
  temperature_enable: true
  # ─── Notifications ────────────────────────────────────────────────────────
  #notify_devices:
  #  - mobile_app_my_phone
  # ─── Scaling ──────────────────────────────────────────────────────────────
  battery_scaling:
    - 1.0
  import_export_scaling: 1.0
  # ─── Export triggers ──────────────────────────────────────────────────────
  export_triggers:
    - name: 'large'
      minutes: 60
      energy: 1.0
    - name: 'small'
      minutes: 15
      energy: 0.25
