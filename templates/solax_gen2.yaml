# Predbat config for SolaX Gen2 hybrid inverters (e.g. SK-SU5000e), via the
# SolaX Modbus integration (https://github.com/wills106/homeassistant-solax-modbus)
#
# Gen2 has no remote control (Mode 8) and no Manual/Force Charge mode select, so
# the Gen4+ template (solax_sx4.yaml) does not work on it. Gen2 is controlled like
# a timed-charge inverter instead: Predbat writes the charge and discharge slot 1
# times and the battery charge/discharge current (in Amps), and switches timed
# operation on and off through two helpers that a small Home Assistant automation
# turns into the inverter's Charger Use Mode ("Force Time Use" / "Self Use Mode").
# See the SolaX Gen2 section of the inverter setup docs.
#
# Copy this over your apps.yaml and:
#   1. Install the SolaX Modbus integration and check its sensors work. The entity
#      names below assume the default "solax" prefix: change them if yours differ.
#   2. Create the two input_boolean helpers and the Charger Use Mode automation
#      described in the docs.
#   3. Set soc_max to your battery size in kWh, battery_voltage to the nominal
#      maximum battery voltage, and check inverter_limit and battery_rate_max.
#   4. For two inverters set num_inverters to 2 and uncomment the second entry of
#      every list below (see the docs for load_power and grid_power).
#   5. Delete the template: True line below once you have configured this file.
---
pred_bat:
  module: predbat
  class: PredBat
  prefix: predbat
  timezone: Europe/London
  currency_symbols:
    - '£'
    - 'p'
  threads: auto
  # XXX: This is a configuration template, delete this line once you edit your configuration
  template: True
  load_filter_threshold: 30

  # ─── SolaX Gen2 energy sensors ────────────────────────────────────────────
  # load_today must be the whole house load. Gen2 has no house load energy
  # sensor, so create one as described in the apps.yaml docs (Data from Home
  # Assistant) and wait a day for it to build up history.
  # With two inverters, list import and export once (they read the same meter)
  # and pv_today once per inverter.
  load_today:
    - sensor.house_load_today
  import_today:
    - sensor.solax_today_s_import_energy
  export_today:
    - sensor.solax_today_s_export_energy
  pv_today:
    - sensor.solax_today_s_solar_energy
    #- sensor.solax_2_today_s_solar_energy

  # ─── SolaX Gen2 inverter definition ───────────────────────────────────────
  # Every setting Predbat reads from an inverter definition is spelled out,
  # because anything left out is copied from the GivEnergy one.
  num_inverters: 1
  inverter_type:
    - "SX2"
    #- "SX2"
  inverter:
    name: "SolaX Gen2 Hybrid"
    has_rest_api: false
    has_mqtt_api: false
    has_service_api: false
    # Gen2 takes charge and discharge rates as a battery current in Amps
    output_charge_control: "current"
    charge_control_immediate: false
    current_dp: 1
    charge_discharge_with_rate: false
    # Timed charge/discharge are switched on and off through the two helpers below
    has_charge_enable_time: true
    has_discharge_enable_time: true
    has_target_soc: false
    target_soc_used_for_discharge: false
    has_reserve_soc: true
    has_timed_pause: false
    time_button_press: false
    support_charge_freeze: false
    support_discharge_freeze: false
    support_feedin_first: false
    has_ge_inverter_mode: false
    has_ge_eco_toggle: false
    has_idle_time: false
    has_time_window: true
    # Slot times are Home Assistant time entities (HH:MM:SS)
    charge_time_format: "HH:MM:SS"
    charge_time_entity_is_option: false
    can_span_midnight: true
    clock_time_format: "%H:%M:%S"
    num_load_entities: 1
    soc_units: "%"
    write_and_poll_sleep: 4

  # ─── SolaX Gen2 control surface (write) ───────────────────────────────────
  # Charge and discharge slot 1 times, written by Predbat
  charge_start_time:
    - time.solax_charge_start_1
    #- time.solax_2_charge_start_1
  charge_end_time:
    - time.solax_charge_end_1
    #- time.solax_2_charge_end_1
  discharge_start_time:
    - time.solax_discharge_start_1
    #- time.solax_2_discharge_start_1
  discharge_end_time:
    - time.solax_discharge_end_1
    #- time.solax_2_discharge_end_1
  # Helpers that the Charger Use Mode automation watches: either one on puts the
  # inverter in "Force Time Use", both off puts it back in "Self Use Mode".
  # Keep them separate - Predbat turns the discharge one off during a charge.
  scheduled_charge_enable:
    - input_boolean.predbat_solax_charge_enable
    #- input_boolean.predbat_solax_2_charge_enable
  scheduled_discharge_enable:
    - input_boolean.predbat_solax_discharge_enable
    #- input_boolean.predbat_solax_2_discharge_enable
  # Battery charge/discharge current in Amps (0-50 A on Gen2)
  timed_charge_current:
    - number.solax_battery_charge_max_current
    #- number.solax_2_battery_charge_max_current
  timed_discharge_current:
    - number.solax_battery_discharge_max_current
    #- number.solax_2_battery_discharge_max_current
  # Nominal MAXIMUM battery voltage (not a live voltage sensor), used to turn
  # Watts into Amps. e.g. 52 for a Pylontech US3000 stack
  battery_voltage:
    - 52
    #- 52
  # Self Use minimum SoC (Battery Minimum Capacity, 10-99%)
  reserve:
    - number.solax_battery_minimum_capacity
    #- number.solax_2_battery_minimum_capacity

  # ─── SolaX Gen2 sensor entities (read) ────────────────────────────────────
  # Battery SoC in % (Gen2 reports it as "Battery Capacity")
  soc_percent:
    - sensor.solax_battery_capacity
    #- sensor.solax_2_battery_capacity
  # Battery size in kWh
  soc_max:
    - 9.6
    #- 9.6
  # Positive while charging on SolaX, Predbat wants discharge positive
  battery_power:
    - sensor.solax_battery_power_charge
    #- sensor.solax_2_battery_power_charge
  battery_power_invert:
    - true
    #- true
  pv_power:
    - sensor.solax_pv_power_total
    #- sensor.solax_2_pv_power_total
  # One whole-house load and one grid meter: with two inverters give the
  # second inverter 0, otherwise Predbat counts the house twice
  load_power:
    - sensor.solax_house_load
    #- 0
  # SolaX meter reads positive while exporting, as Predbat expects
  grid_power:
    - sensor.solax_measured_power
    #- 0
  grid_power_invert:
    - false
    #- false
  battery_temperature:
    - sensor.solax_battery_temperature
    #- sensor.solax_2_battery_temperature

  battery_temperature_history:
    - sensor.solax_battery_temperature

  # ─── SolaX Gen2 battery and inverter limits ───────────────────────────────
  # Gen2's battery current register tops out at 50 A, which is about 2400 W on
  # a 48 V battery - more than that would ask the inverter for more than 50 A
  battery_rate_max:
    - 2400
    #- 2400
  # Inverter AC limit in W, 5000 for the SK-SU5000e
  inverter_limit:
    - 5000
    #- 5000
  inverter_clock_skew_start: 0
  inverter_clock_skew_end: 0
  inverter_clock_skew_discharge_start: 0
  inverter_clock_skew_discharge_end: 0
  clock_skew: 0

  # ─── Solcast solar forecast ───────────────────────────────────────────────
  # Solcast cloud interface, set this or the local interface below
  #solcast_host: 'https://api.solcast.com.au/'
  #solcast_api_key: 'xxxx'
  #solcast_poll_hours: 8
  pv_forecast_today: re:(sensor.(solcast_|)(pv_forecast_|)forecast_today)
  pv_forecast_tomorrow: re:(sensor.(solcast_|)(pv_forecast_|)forecast_tomorrow)
  pv_forecast_d3: re:(sensor.(solcast_|)(pv_forecast_|)forecast_(day_3|d3))
  pv_forecast_d4: re:(sensor.(solcast_|)(pv_forecast_|)forecast_(day_4|d4))
  # ─── Car charging ─────────────────────────────────────────────────────────
  car_charging_energy: 're:(sensor.myenergi_zappi_[0-9a-z]+_charge_added_session|sensor.wallbox_portal_added_energy)'

  # car_charging_power is the live charging power of your car charger, in Watts
  # It is display only - it drives the car shown on the web interface power flow diagram
  # and the predbat.car_charging_power sensor. The plan itself is unaffected by it.
  # Automatically set to detect Wallbox and Zappi, if it doesn't match manually enter your sensor name
  car_charging_power: 're:(sensor.myenergi_zappi_[0-9a-z]+_internal_load_ct1|sensor.wallbox_portal_charging_power)'
  num_cars: 1
  car_charging_planned:
    - 're:(sensor.wallbox_portal_status_description|sensor.myenergi_zappi_[0-9a-z]+_plug_status)'
  car_charging_planned_response:
    - 'yes'
    - 'on'
    - 'true'
    - 'connected'
    - 'ev connected'
    - 'ev ready to charge'
    - 'charging'
    - 'paused'
    - 'waiting for car demand'
    - 'waiting for ev'
    - 'scheduled'
    - 'enabled'
    - 'latched'
    - 'locked'
    - 'plugged in'
    - 'waiting'
  # car_charging_now can be set to a sensor that shows the car is charging right now, so that
  # Predbat holds the house battery for the car while it charges. It never adds a charging slot.
  # Use an on/off sensor (matched against car_charging_now_response), or a charging power sensor
  # in W or kW where 200W or more counts as charging - e.g. for a Wallbox charger:
  #car_charging_now:
  #  - sensor.wallbox_portal_charging_power
  car_charging_now_response:
    - 'yes'
    - 'on'
    - 'true'
    - 'charging'
  #car_charging_battery_size:
  #  - 75
  #car_charging_limit:
  #  - 're:number.tsunami_charge_limit'
  #car_charging_soc:
  #  - 're:sensor.tsunami_battery'
  #car_charging_exclusive:
  #  - True
  # ─── Octopus Energy ───────────────────────────────────────────────────────
  octopus_intelligent_slot: 're:(binary_sensor.octopus_energy([0-9a-z_]+|)_intelligent_dispatching)'
  octopus_ready_time: 're:((select|time).octopus_energy_([0-9a-z_]+|)_intelligent_target_time)'
  octopus_charge_limit: 're:(number.octopus_energy([0-9a-z_]+|)_intelligent_charge_target)'
  #octopus_intelligent_slot: 'binary_sensor.ohme_slot_active'
  #octopus_ready_time: 'time.ohme_target_time'
  #octopus_charge_limit: 'number.ohme_target_percent'
  #octopus_slot_low_rate: False
  octopus_saving_session: 're:(event.octopus_energy([0-9a-z_]+|)_saving_session_event(s|))'
  octopus_saving_session_octopoints_per_penny: 8
  octopus_free_session: 're:(event.octopus_energy_([0-9a-z_]+|)_octoplus_free_electricity_session_events)'
  # octopus_free_url: 'http://octopus.energy/free-electricity'
  # axle_api_key: "xxxxxxx"
  # ─── Energy rates ─────────────────────────────────────────────────────────
  metric_octopus_import: 're:(event.octopus_energy_electricity_[0-9a-z_]+(?<!export)_current_day_rates)'
  #metric_octopus_export: 're:(event.octopus_energy_electricity_[0-9a-z_]+_export_current_day_rates)'
  metric_standing_charge: 're:(sensor.(octopus_energy_|)electricity_[0-9a-z]+_[0-9a-z]+_current_standing_charge)'
  #metric_energidataservice_import: 'sensor.energi_data_service_import'
  #metric_energidataservice_export: 'sensor.energi_data_service_export'
  #rates_import:
  #  -  start: "00:30:00"
  #     end: "04:30:00"
  #     rate: 7.5
  #  -  start: "04:30:00"
  #     end: "00:30:00"
  #     rate: 40.0
  #rates_export:
  #  -  rate: 4.2
  # rates_import_octopus_url : "https://api.oegb-kraken.energy/v1/products/AGILE-24-10-01/electricity-tariffs/E-1R-AGILE-24-10-01-{octopus_region}/standard-unit-rates"
  # rates_export_octopus_url: "https://api.oegb-kraken.energy/v1/products/AGILE-OUTGOING-19-05-13/electricity-tariffs/E-1R-AGILE-OUTGOING-19-05-13-A/standard-unit-rates/"
  #rates_import_override:
  # -  date: '2023-09-10'
  #    start: '14:00:00'
  #    end: '14:30:00'
  #    rate: 112
  #    load_scaling: 0.8
  # ─── Forecast and history ─────────────────────────────────────────────────
  days_previous:
    - 7
  forecast_hours: 48
  load_ml_enable: true
  # load_ml_source: true
  temperature_enable: true
  # ─── Notifications ────────────────────────────────────────────────────────
  #notify_devices:
  #  - mobile_app_my_phone
  # ─── Scaling ──────────────────────────────────────────────────────────────
  battery_scaling:
    - 1.0
  import_export_scaling: 1.0
  # ─── Export triggers ──────────────────────────────────────────────────────
  export_triggers:
    - name: 'large'
      minutes: 60
      energy: 1.0
    - name: 'small'
      minutes: 15
      energy: 0.25
  #iboost_energy_today: 'sensor.xxxxx'
  #iboost_energy_scaling: 1.0
  #metric_octopus_gas: 're:(sensor.(octopus_energy_|)gas_[0-9a-z]+_[0-9a-z]+_current_rate)'
