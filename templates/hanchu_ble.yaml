# Predbat config for the Hanchu iESS, via the hanchu-ess-ble HACS
# integration (https://github.com/upton68/hanchu-ess-ble) — local Bluetooth
# control, no dependency on the Hanchu cloud.
#
# Copy this over your apps.yaml and:
#   1. Install the "Hanchu ESS BLE" integration via HACS — see its README
#      for Bluetooth proxy hardware requirements.
#   2. Create the two helpers (see inverter-setup docs).
#   3. Create the bridge script (see inverter-setup docs).
#   4. Create the derived daily-energy helpers for load/PV/import/export —
#      not natively available over BLE (see inverter-setup docs).
#   5. Replace YOURDEVICE throughout with your device's entity slug as it
#      appears in your HA entity IDs (e.g. hc_l110ym56g0915).
#   6. Adjust inverter_limit, inverter_limit_charge, inverter_limit_discharge,
#      inverter_limit_export and battery_rate_max to match your hardware.
#   7. If running this as a second, standalone Predbat instance alongside an
#      existing cloud-based one (rather than as a Home Assistant add-on),
#      uncomment and set ha_url/ha_key below, and give this instance its own
#      unique `prefix` so its entities don't collide with the other instance.
#   8. Delete the template: True line below once you have configured this file.
#
# Note: The 5000W limits are set to the author's hardware — adjust these
# to match your own inverter and battery rated capacity.
---
pred_bat:
  module: predbat
  class: PredBat
  prefix: predbat_ble
  # Only needed when running Predbat standalone (e.g. in its own Docker
  # container) rather than as a Home Assistant add-on — uncomment and set
  # to your HA instance's URL and a Long-Lived Access Token created under
  # your HA profile's Security settings.
  # ha_url: 'http://YOUR_HA_IP:8123'
  # ha_key: 'YOUR_LONG_LIVED_ACCESS_TOKEN'
  timezone: Europe/London
  currency_symbols:
    - '£'
    - 'p'
  threads: auto
  # XXX: This is a configuration template, delete this line once you edit your configuration
  template: True
  load_filter_threshold: 30
  # ─── Hanchu iESS BLE daily energy sensors ─────────────────────────────────
  # None of these are natively available over BLE (unlike the cloud
  # integration) — all four are derived using HA's built-in Riemann sum
  # (Integral) + Utility Meter helpers on the corresponding live power
  # sensor. See "Step 4 — Create the daily energy helpers" in the
  # inverter-setup docs for the full worked example (Grid Import/Export);
  # replicate the same pattern for Load and PV.
  load_today:
    - sensor.YOURDEVICE_load_power_today
  pv_today:
    - sensor.YOURDEVICE_pv_power_today
  export_today:
    - sensor.hanchu_ble_grid_export_today
  import_today:
    - sensor.hanchu_ble_grid_import_today
  # ─── Hanchu iESS BLE inverter definition ──────────────────────────────────
  num_inverters: 1
  inverter_type: "HC"
  inverter:
    name: "Hanchu iESS BLE"
    has_rest_api: false
    has_mqtt_api: false
    has_service_api: true
    output_charge_control: "power"
    charge_control_immediate: true
    has_charge_enable_time: false
    has_discharge_enable_time: false
    has_target_soc: false
    has_reserve_soc: false
    has_timed_pause: false
    charge_time_format: "S"
    charge_time_entity_is_option: false
    soc_units: "%"
    num_load_entities: 1
    has_ge_inverter_mode: false
    has_fox_inverter_mode: false
    time_button_press: false
    clock_time_format: "%d-%m-%y %H:%M:%S"
    write_and_poll_sleep: 2
    has_time_window: false
    support_charge_freeze: false
    support_discharge_freeze: false
  # ─── Hanchu iESS BLE control surface (write) ──────────────────────────────
  # All four hooks call the same queued script, passing mode_action so it
  # knows which state to apply. See inverter-setup docs for the full script.
  charge_start_service:
    - service: script.hanchu_ble_set_state_queued
      data:
        mode_action: charge_start
  charge_stop_service:
    - service: script.hanchu_ble_set_state_queued
      data:
        mode_action: charge_stop
  discharge_start_service:
    - service: script.hanchu_ble_set_state_queued
      data:
        mode_action: discharge_start
  discharge_stop_service:
    - service: script.hanchu_ble_set_state_queued
      data:
        mode_action: discharge_stop
  # ─── Hanchu iESS BLE sensor entities (read) ───────────────────────────────
  # charge_rate/discharge_rate deliberately point at placeholder helpers, NOT the
  # integration's charge/discharge power limit entities. Predbat writes these
  # directly (outside the bridge script), and on BLE a direct write is only
  # staged - it then gets flushed to the inverter by whichever confirm_write
  # runs next, so its effect would depend on timing. See "Hanchu BLE Notes".
  charge_rate:
    - input_number.predbat_ble_charge_rate
  discharge_rate:
    - input_number.predbat_ble_discharge_rate
  battery_power:
    - sensor.YOURDEVICE_battery_power
  battery_power_invert:
    - true
  pv_power:
    - sensor.YOURDEVICE_p237
  load_power:
    - sensor.YOURDEVICE_load_power
  load_power_invert:
    - false
  grid_power:
    - sensor.YOURDEVICE_p644
  grid_power_invert:
    - true
  soc_percent:
    - sensor.YOURDEVICE_battery_soc
  soc_max:
    - sensor.YOURDEVICE_p088  # Already reports capacity in kWh for this integration — no conversion needed
  battery_min_soc:
    - 10
  battery_voltage:
    - sensor.YOURDEVICE_battery_voltage
  # ─── Hanchu iESS BLE battery physical specs ───────────────────────────────
  # Adjust all limits to match your inverter and battery rated capacity in watts
  inverter_battery_rate_min:
    - 500
  inverter_limit:
    - 5000
  inverter_limit_charge:
    - 5000
  inverter_limit_discharge:
    - 5000
  inverter_limit_export:
    - 5000
  battery_rate_max:
    - 5000
  # Charge/discharge power curves based on observed Hanchu iESS behaviour
  battery_charge_power_curve:
    97: 0.5
    98: 0.2
    99: 0.1
  battery_discharge_power_curve:
    4: 1.0
  inverter_clock_skew_start: 0
  inverter_clock_skew_end: 0
  inverter_clock_skew_discharge_start: 0
  inverter_clock_skew_discharge_end: 0
  inverter_can_charge_during_export: false  # Single inverter setup
  clock_skew: 0
  balance_inverters_seconds: 0
  # ─── Solcast solar forecast ───────────────────────────────────────────────
  # Solcast cloud interface, set this or the local interface below
  #solcast_host: 'https://api.solcast.com.au/'
  #solcast_api_key: 'xxxx'
  #solcast_poll_hours: 8
  pv_forecast_today: re:(sensor.(solcast_|)(pv_forecast_|)forecast_today)
  pv_forecast_tomorrow: re:(sensor.(solcast_|)(pv_forecast_|)forecast_tomorrow)
  pv_forecast_d3: re:(sensor.(solcast_|)(pv_forecast_|)forecast_(day_3|d3))
  pv_forecast_d4: re:(sensor.(solcast_|)(pv_forecast_|)forecast_(day_4|d4))
  # ─── Car charging ─────────────────────────────────────────────────────────
  car_charging_energy: 're:(sensor.myenergi_zappi_[0-9a-z]+_charge_added_session|sensor.wallbox_portal_added_energy)'

  # car_charging_power is the live charging power of your car charger, in Watts
  # It is display only - it drives the car shown on the web interface power flow diagram
  # and the predbat.car_charging_power sensor. The plan itself is unaffected by it.
  # Automatically set to detect Wallbox and Zappi, if it doesn't match manually enter your sensor name
  car_charging_power: 're:(sensor.myenergi_zappi_[0-9a-z]+_internal_load_ct1|sensor.wallbox_portal_charging_power)'
  num_cars: 1
  car_charging_planned:
    - 're:(sensor.wallbox_portal_status_description|sensor.myenergi_zappi_[0-9a-z]+_plug_status)'
  car_charging_planned_response:
    - 'yes'
    - 'on'
    - 'true'
    - 'connected'
    - 'ev connected'
    - 'ev ready to charge'
    - 'charging'
    - 'paused'
    - 'waiting for car demand'
    - 'waiting for ev'
    - 'scheduled'
    - 'enabled'
    - 'latched'
    - 'locked'
    - 'plugged in'
    - 'waiting'
  # car_charging_now can be set to a sensor that shows the car is charging right now, so that
  # Predbat holds the house battery for the car while it charges. It never adds a charging slot.
  # Use an on/off sensor (matched against car_charging_now_response), or a charging power sensor
  # in W or kW where 200W or more counts as charging - e.g. for a Wallbox charger:
  #car_charging_now:
  #  - sensor.wallbox_portal_charging_power
  car_charging_now_response:
    - 'yes'
    - 'on'
    - 'true'
  #car_charging_battery_size:
  #  - 75
  #car_charging_limit:
  #  - 're:number.tsunami_charge_limit'
  #car_charging_soc:
  #  - 're:sensor.tsunami_battery'
  #car_charging_exclusive:
  #  - True
  # ─── Octopus Energy ───────────────────────────────────────────────────────
  octopus_intelligent_slot: 're:(binary_sensor.octopus_energy([0-9a-z_]+|)_intelligent_dispatching)'
  octopus_ready_time: 're:((select|time).octopus_energy_([0-9a-z_]+|)_intelligent_target_time)'
  octopus_charge_limit: 're:(number.octopus_energy([0-9a-z_]+|)_intelligent_charge_target)'
  #octopus_intelligent_slot: 'binary_sensor.ohme_slot_active'
  #octopus_ready_time: 'time.ohme_target_time'
  #octopus_charge_limit: 'number.ohme_target_percent'
  #octopus_slot_low_rate: False
  octopus_saving_session: 're:(event.octopus_energy([0-9a-z_]+|)_saving_session_event(s|))'
  octopus_saving_session_octopoints_per_penny: 8
  octopus_free_session: 're:(event.octopus_energy_([0-9a-z_]+|)_octoplus_free_electricity_session_events)'
  # octopus_free_url: 'http://octopus.energy/free-electricity'
  # axle_api_key: "xxxxxxx"
  # ─── Energy rates ─────────────────────────────────────────────────────────
  metric_octopus_import: 're:(event.octopus_energy_electricity_[0-9a-z_]+(?<!export)_current_day_rates)'
  #metric_octopus_export: 're:(event.octopus_energy_electricity_[0-9a-z_]+_export_current_day_rates)'
  metric_standing_charge: 're:(sensor.(octopus_energy_|)electricity_[0-9a-z]+_[0-9a-z]+_current_standing_charge)'
  #metric_energidataservice_import: 'sensor.energi_data_service_import'
  #metric_energidataservice_export: 'sensor.energi_data_service_export'
  #rates_import:
  #  -  start: "00:30:00"
  #     end: "04:30:00"
  #     rate: 7.5
  #  -  start: "04:30:00"
  #     end: "00:30:00"
  #     rate: 40.0
  #rates_export:
  #  -  rate: 4.2
  # rates_import_octopus_url : "https://api.octopus.energy/v1/products/AGILE-24-10-01/electricity-tariffs/E-1R-AGILE-24-10-01-{octopus_region}/standard-unit-rates"
  # rates_export_octopus_url: "https://api.octopus.energy/v1/products/AGILE-OUTGOING-19-05-13/electricity-tariffs/E-1R-AGILE-OUTGOING-19-05-13-A/standard-unit-rates/"
  #rates_import_override:
  # -  date: '2023-09-10'
  #    start: '14:00:00'
  #    end: '14:30:00'
  #    rate: 112
  #    load_scaling: 0.8
  # ─── Forecast and history ─────────────────────────────────────────────────
  days_previous:
    - 7
  days_previous_weight:
    - 1
  forecast_hours: 48
  load_ml_enable: true
  # load_ml_source: true
  temperature_enable: true
  # ─── Notifications ────────────────────────────────────────────────────────
  #notify_devices:
  #  - mobile_app_treforsiphone12_2
  # ─── Scaling ──────────────────────────────────────────────────────────────
  battery_scaling:
    - 1.0
  import_export_scaling: 1.0
  # ─── Export triggers ──────────────────────────────────────────────────────
  export_triggers:
    - name: 'large'
      minutes: 60
      energy: 1.0
    - name: 'small'
      minutes: 15
      energy: 0.25
