# Board predbat-memory: cut Predbat's memory use with plans unchanged.
# Run it with the board runner from agent-memory-supabase (runner/README.md there):
#     board-runner run boards/predbat-memory/board.toml
# It needs coverage/memory_benchmark first (see README.md beside this file).

board = "predbat-memory"
scope = "predbat-devs"
workspace = "~/predbat/batpred"

goal = """Cut Predbat's memory use. On the standalone memory benchmark (coverage/memory_benchmark: Predbat run \
standalone with db_primary and the dummy inverter, in a Linux container, for a fixed run of plan cycles), lower the \
steady-state RSS by at least 25% against main without changing any plan, so every install needs less RAM. Steady \
state is what counts; the peak only has to stay within 10% of main's. What Predbat holds includes the Python libraries it loads, and reviewing and \
cutting those is in scope as much as the data its plan cycles keep."""

done_when = """Facts show a single branch whose median steady-state RSS over three runs is at least 25% below main's, \
measured interleaved with main on the same machine and benchmark (each tree runs in the image the benchmark builds \
from its own requirements.txt, so a branch that drops a dependency is measured without it), with its median peak RSS \
no more than 10% above main's, its plan_digest identical to main's in \
every run, and ./run_all --quick and ./run_pre_commit passing on the branch. The board's measurement \
(boards/predbat-memory/measure.py) then confirms it."""

rules = """Rules for board predbat-memory.
Baseline first: until the board has a confirmed baseline fact, the only intent is the baseline intent, and no saving \
work starts. That intent records the main commit hash, measures main with the benchmark three times (every run's \
figures and the medians, steady and peak, MB), and maps where the memory goes: the largest holders by MB from \
`coverage/memory_benchmark --tracemalloc <worktree> <out dir>`, which writes <out dir>/tracemalloc.txt (the top \
allocations by line and by file after the last cycle). A --tracemalloc run's RSS includes tracemalloc's own overhead, \
so its figures are never evidence; measure.py refuses them. The map also lists the libraries loaded, from \
<out dir>/modules.txt, which every benchmark run writes (each top-level package's loaded modules, their compiled \
size and whether it is third-party, stdlib or local), because tracemalloc puts the cost of an import under importlib, \
not under the library imported. Every later figure is compared with main, and the map is what the lead plans from.
Libraries: a loaded library is a saving to look for, measured like any other. Import it only where it is used, so a \
code path the benchmark does not run does not load it; replace a heavy library with the standard library or a few \
lines when only a small part of it is used; drop an import nothing uses, and a requirements.txt entry once nothing \
imports it. The benchmark builds its image from the tree's own requirements.txt, so a dropped dependency is measured \
as gone. The code path that needs the library must still work and keep its tests.
How to work: Each intent gets its own git worktree of ~/predbat/batpred at \
~/predbat/batpred/.worktrees/board-memory-<first 8 chars of the intent id>, on a new local branch \
board/predbat-memory/<same 8 chars>. It starts from the commit the intent names. If the intent names none, start from \
main, or from any earlier board commit whose fact is confirmed, and say which in the fact. To combine savings, \
cherry-pick, merge or rebase board commits onto the branch. Use merge and rebase only on your own intent's branch, in \
your own worktree: never on main or another intent's branch, which other facts cite by commit. Build the kernel in that worktree with `bash apps/predbat/build_kernel.sh`. \
Find what holds the memory before changing code, naming the objects and their MB.
Shell commands: workers run with a fixed allow list (the [permissions] below), and a command outside it is refused, \
not asked about. Run `cd <dir>` as a Bash call of its own; it carries over to later calls. Never put `cd` and `git` in \
the same call: that chain is refused even when each part is allowed. Create a worktree from the main checkout with \
absolute paths (`git worktree add -b <branch> <absolute worktree path> <commit>`), then `cd <worktree>` in its own \
call, then build, commit and test there one command per call (`bash apps/predbat/build_kernel.sh`; \
`cd <worktree>/coverage` and then `./run_all --quick`). Python is allowed for profiling and analysis (python3, or \
~/predbat/batpred/coverage/venv/bin/python3 when a script needs Predbat's dependencies), but never use it to do what \
the deny list refuses, and never install packages (no pip, no `python3 -m pip`). Avoid subshells `( ... )`. A refused command means that spelling is not allowed, not that the intent is blocked: retry it \
in an allowed form (one allowed command per call is always accepted) before giving up. Whatever happens, end with a \
BOARD-WORK line; a run that ends without one is counted as lost.
Commits: each change is one commit whose message starts `board(predbat-memory <intent short id>): <what it saves>`, \
so `git log --oneline main..<commit>` lists every saving in a tree. Run that before building on a commit, to see what \
it already contains.
How to verify:
- Benchmark = `coverage/memory_benchmark <worktree> <out dir>`, run from the main checkout. It writes \
<out dir>/result.json with ok, steady_rss_mb, peak_rss_mb and plan_digest. Run main and the branch interleaved, three \
rounds each, and take the median of each figure.
- Linux RSS from the benchmark only. macOS RSS swings with page compression and is not evidence.
- The kernel must be active on both sides: no "stale binary ... using Python engine" line in either log. A stale \
binary falls back to Python and changes RSS by itself.
- Plans must be identical: the branch's plan_digest equals main's in every run. Any difference makes the result \
refuted, whatever the saving.
- Before a confirmed saving: `./run_all --quick` and `./run_pre_commit` (both from coverage/, which set up their own \
Python environment) pass on the branch.
Evidence: every fact about a commit starts with these lines, so other workers and the lead can see what a tree holds \
and what it achieved:
  Commit: <hash> on board/predbat-memory/<short id>
  Built on: <hash it started from> (main, or the fact id of that commit)
  Tree contains: one line per board commit in `git log --oneline main..<hash>`, each with the fact id that measured it
  Steady: <branch median> MB against main <median> MB (<percent>); Peak (limit +10%): <branch median> MB \
against main <median> MB (<percent>)
Then: every run's figures and the machine; the plan_digest comparison; what the saving removed (which objects, how \
many MB); the commands run.
Long output: logs, snapshots and profiles go under /tmp/predbat-board/memory/<intent short id>/. Facts cite the path \
and quote only the key lines.
Allowed beyond the base safety rules: creating local branches and worktrees in ~/predbat/batpred, building the \
kernel, running the benchmark (it starts Linux containers), and local commits on board/predbat-memory/* branches. \
Everything stays local: no push.
Never: commit to main, move or delete another intent's branch, or push anything. Never edit coverage/memory_benchmark, its test case or boards/. Never win \
memory by changing behaviour: no dropped or disabled features or components, no shorter history than a reader of it \
needs, no changed outputs. Never weaken or skip tests. Never put customer data, customer debug files, instance ids or \
names on the board (predbat-devs is public-safe)."""

max_open_intents = 2
claim_minutes = 90
max_intents = 20

[measure]
command = "python3 boards/predbat-memory/measure.py"
timeout_minutes = 60

[lead]
model = "opus"
round_every_minutes = 20
# When the lead is stuck for ideas it asks a sub-agent on this model. Needs the runner from agent-memory-supabase
# PR #17 or later: an older runner rejects the key.
ideas_model = "fable"

[[worker]]
model = "opus"

[[worker]]
model = "sonnet"

[permissions]
# A local run on the maintainer's machine, so the workers are trusted with the tools the intents need: Python (to
# profile with importtime, gc referrers or deeper tracemalloc), merge and rebase (to combine earlier board commits on
# their own branch) and the everyday read-only tools. A deny entry matches only its own command, so a Python script
# could still do what the list denies; it is there to stop mistakes, not a determined worker, as ./run_all already runs
# the worktree's own code on the host. What it stops: anything that leaves the machine, rewriting main or another
# intent's branch, throwing work away, and changing the shared venv. test_measure.py checks both lists.
allow = [
  "Read(~/predbat/**)",
  "Edit(~/predbat/batpred/.worktrees/board-memory-*/**)",
  "Write(~/predbat/batpred/.worktrees/board-memory-*/**)",
  "Read(//tmp/predbat-board/**)",
  "Edit(//tmp/predbat-board/**)",
  "Write(//tmp/predbat-board/**)",
  "Glob",
  "Grep",
  "Bash(git worktree *)",
  "Bash(git status*)",
  "Bash(git diff*)",
  "Bash(git log*)",
  "Bash(git show*)",
  "Bash(git rev-parse*)",
  "Bash(git rev-list*)",
  "Bash(git merge-base*)",
  "Bash(git branch*)",
  "Bash(git switch *)",
  "Bash(git checkout *)",
  "Bash(git add *)",
  "Bash(git commit *)",
  "Bash(git cherry-pick *)",
  "Bash(git merge *)",
  "Bash(git rebase *)",
  "Bash(git restore *)",
  "Bash(git stash*)",
  "Bash(cd *)",
  "Bash(bash apps/predbat/build_kernel.sh*)",
  "Bash(coverage/memory_benchmark *)",
  "Bash(*/coverage/memory_benchmark *)",
  "Bash(./memory_benchmark *)",
  "Bash(./run_all*)",
  "Bash(./run_pre_commit*)",
  "Bash(python3 *)",
  "Bash(python *)",
  "Bash(*/coverage/venv/bin/python3 *)",
  "Bash(*/coverage/venv/bin/python *)",
  "Bash(mkdir *)",
  "Bash(cp *)",
  "Bash(mv *)",
  "Bash(rm *)",
  "Bash(touch *)",
  "Bash(ls*)",
  "Bash(cat *)",
  "Bash(head *)",
  "Bash(tail *)",
  "Bash(wc *)",
  "Bash(grep *)",
  "Bash(find *)",
  "Bash(sort *)",
  "Bash(uniq *)",
  "Bash(cut *)",
  "Bash(tr *)",
  "Bash(awk *)",
  "Bash(sed *)",
  "Bash(diff *)",
  "Bash(du *)",
  "Bash(file *)",
  "Bash(stat *)",
  "Bash(which *)",
  "Bash(env)",
  "Bash(uname*)",
