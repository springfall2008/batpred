deny = [
  "Bash(git push*)",
  "Bash(git reset --hard*)",
  "Bash(git branch -f*)",
  "Bash(git branch --force*)",
  "Bash(git branch -D*)",
  "Bash(git branch -d*)",
  "Bash(git branch -m*)",
  "Bash(git branch -M*)",
  "Bash(git update-ref*)",
  "Bash(git checkout -B*)",
  "Bash(git switch -C*)",
  "Bash(git clean*)",
  "Bash(rm -rf*)",
  "Bash(rm -fr*)",
  "Bash(rm -r*)",
  "Bash(gh *)",
  "Bash(pip *)",
  "Bash(pip3 *)",
  "Bash(docker rm*)",
  "Bash(docker rmi*)",
  "Bash(docker system*)",
  "Edit(~/predbat/batpred/apps/**)",
  "Write(~/predbat/batpred/apps/**)",
  "Edit(~/predbat/batpred/coverage/**)",
  "Write(~/predbat/batpred/coverage/**)",
  "Edit(~/predbat/batpred/boards/**)",
  "Write(~/predbat/batpred/boards/**)",
]
max_turns = 300
worker_timeout_minutes = 90
