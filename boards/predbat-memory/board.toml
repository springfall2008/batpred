# Board predbat-memory: cut Predbat's memory use with plans unchanged.
# Run it with the board runner from agent-memory-supabase (runner/README.md there):
#     board-runner run boards/predbat-memory/board.toml
# It needs coverage/memory_benchmark first (see README.md beside this file).

board = "predbat-memory"
scope = "predbat-devs"
workspace = "~/predbat/batpred"

goal = """Cut Predbat's memory use. On the standalone memory benchmark (coverage/memory_benchmark: Predbat run \
standalone with db_primary and the dummy inverter, in a Linux container, for a fixed run of plan cycles), lower the \
steady-state RSS by at least 25% against main without changing any plan, so every install needs less RAM."""

done_when = """Facts show a single branch whose median steady-state RSS over three runs is at least 25% below main's, \
measured interleaved with main on the same machine and container image, with its median peak RSS no higher than \
main's, its plan_digest identical to main's in every run, and ./run_all --quick and ./run_pre_commit passing on the \
branch. The board's measurement (boards/predbat-memory/measure.py) then confirms it."""

rules = """Rules for board predbat-memory.
Baseline first: until the board has a confirmed baseline fact, the only intent is the baseline intent, and no saving \
work starts. That intent records the main commit hash, measures main with the benchmark three times (every run's \
figures and the medians, steady and peak, MB), and maps where the memory goes: the largest holders by MB from \
`coverage/memory_benchmark --tracemalloc <worktree> <out dir>`, which writes <out dir>/tracemalloc.txt (the top \
allocations by line and by file after the last cycle). A --tracemalloc run's RSS includes tracemalloc's own overhead, \
so its figures are never evidence; measure.py refuses them. Every later figure is compared with main, and the map is \
what the lead plans from.
How to work: Each intent gets its own git worktree of ~/predbat/batpred at \
~/predbat/batpred/.worktrees/board-memory-<first 8 chars of the intent id>, on a new local branch \
board/predbat-memory/<same 8 chars>. It starts from the commit the intent names. If the intent names none, start from \
main, or from any earlier board commit whose fact is confirmed, and say which in the fact. To combine savings, \
cherry-pick board commits onto the branch. Build the kernel in that worktree with `bash apps/predbat/build_kernel.sh`. \
Find what holds the memory before changing code, naming the objects and their MB.
Commits: each change is one commit whose message starts `board(predbat-memory <intent short id>): <what it saves>`, \
so `git log --oneline main..<commit>` lists every saving in a tree. Run that before building on a commit, to see what \
it already contains.
How to verify:
- Benchmark = `coverage/memory_benchmark <worktree> <out dir>`, run from the main checkout. It writes \
<out dir>/result.json with ok, steady_rss_mb, peak_rss_mb and plan_digest. Run main and the branch interleaved, three \
rounds each, and take the median of each figure.
- Linux RSS from the benchmark only. macOS RSS swings with page compression and is not evidence.
- The kernel must be active on both sides: no "stale binary ... using Python engine" line in either log. A stale \
binary falls back to Python and changes RSS by itself.
- Plans must be identical: the branch's plan_digest equals main's in every run. Any difference makes the result \
refuted, whatever the saving.
- Before a confirmed saving: `./run_all --quick` and `./run_pre_commit` (both from coverage/, which set up their own \
Python environment) pass on the branch.
Evidence: every fact about a commit starts with these lines, so other workers and the lead can see what a tree holds \
and what it achieved:
  Commit: <hash> on board/predbat-memory/<short id>
  Built on: <hash it started from> (main, or the fact id of that commit)
  Tree contains: one line per board commit in `git log --oneline main..<hash>`, each with the fact id that measured it
  Steady: <branch median> MB against main <median> MB (<percent>); Peak: <branch median> MB against main <median> MB
Then: every run's figures and the machine; the plan_digest comparison; what the saving removed (which objects, how \
many MB); the commands run.
Long output: logs, snapshots and profiles go under /tmp/predbat-board/memory/<intent short id>/. Facts cite the path \
and quote only the key lines.
Allowed beyond the base safety rules: creating local branches and worktrees in ~/predbat/batpred, building the \
kernel, running the benchmark (it starts Linux containers), and local commits on board/predbat-memory/* branches. \
Everything stays local: no push.
Never: commit to main, move or delete another intent's branch, or push anything. Never edit coverage/memory_benchmark, its test case or boards/. Never win \
memory by changing behaviour: no dropped or disabled features or components, no shorter history than a reader of it \
needs, no changed outputs. Never weaken or skip tests. Never put customer data, customer debug files, instance ids or \
names on the board (predbat-devs is public-safe)."""

max_open_intents = 2
claim_minutes = 90
max_intents = 20

[measure]
command = "python3 boards/predbat-memory/measure.py"
timeout_minutes = 60

[lead]
model = "opus"
round_every_minutes = 20
# When the lead is stuck for ideas it asks a sub-agent on this model. Needs the runner from agent-memory-supabase
# PR #17 or later: an older runner rejects the key.
ideas_model = "fable"

[[worker]]
model = "opus"

[[worker]]
model = "sonnet"

[permissions]
# No entry runs a general interpreter (python3 *, bash *, env * and the like): a deny matches only its own tool, so a
# script could reach every Edit, Write and Bash deny below. Tests run through ./run_all, profiling through
# coverage/memory_benchmark --tracemalloc. These rules stop mistakes, not a determined worker: ./run_all runs the
# worktree's own code on the host. test_measure.py checks no general interpreter is allowed.
allow = [
  "Read(~/predbat/**)",
  "Edit(~/predbat/batpred/.worktrees/board-memory-*/**)",
  "Write(~/predbat/batpred/.worktrees/board-memory-*/**)",
  "Read(//tmp/predbat-board/**)",
  "Edit(//tmp/predbat-board/**)",
  "Write(//tmp/predbat-board/**)",
  "Glob",
  "Grep",
  "Bash(git worktree *)",
  "Bash(git status*)",
  "Bash(git diff*)",
  "Bash(git log*)",
  "Bash(git show*)",
  "Bash(git rev-parse*)",
  "Bash(git branch*)",
  "Bash(git switch *)",
  "Bash(git checkout *)",
  "Bash(git add *)",
  "Bash(git commit *)",
  "Bash(git cherry-pick *)",
  "Bash(git stash*)",
  "Bash(cd *)",
  "Bash(bash apps/predbat/build_kernel.sh*)",
  "Bash(coverage/memory_benchmark *)",
  "Bash(*/coverage/memory_benchmark *)",
  "Bash(./memory_benchmark *)",
  "Bash(./run_all*)",
  "Bash(./run_pre_commit*)",
  "Bash(mkdir *)",
  "Bash(ls*)",
  "Bash(cat *)",
  "Bash(head *)",
  "Bash(tail *)",
  "Bash(wc *)",
  "Bash(grep *)",
  "Bash(date*)",
]
deny = [
  "Bash(git merge*)",
  "Bash(git rebase*)",
  "Bash(git reset --hard*)",
  "Bash(git branch -f*)",
  "Bash(git branch --force*)",
  "Bash(git branch -D*)",
  "Bash(git branch -d*)",
  "Bash(git branch -m*)",
  "Bash(git branch -M*)",
  "Bash(git update-ref*)",
  "Bash(git checkout -B*)",
  "Bash(git switch -C*)",
  "Bash(rm -rf*)",
  "Bash(gh *)",
  "Bash(pip *)",
  "Edit(~/predbat/batpred/apps/**)",
  "Write(~/predbat/batpred/apps/**)",
  "Edit(~/predbat/batpred/coverage/**)",
  "Write(~/predbat/batpred/coverage/**)",
  "Edit(~/predbat/batpred/boards/**)",
  "Write(~/predbat/batpred/boards/**)",
]
max_turns = 300
worker_timeout_minutes = 90
